
name: HappyHeadlines CD

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: ArticleService
            image: articleservice
          - service: CommentService
            image: commentservice
          - service: NewsletterService
            image: newsletterservice
          - service: ProfanityService
            image: profanityservice
          - service: SubscriberService
            image: subscriberservice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/happyheadlines-${{ matrix.image }}:latest
            ghcr.io/${{ env.OWNER_LC }}/happyheadlines-${{ matrix.image }}:${{ github.sha }}
