services:
  article-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports:
      - "5433:5432"
    volumes:
      - article-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: hh
    ports:
      - "5434:5432"
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hh -d comments"]
      interval: 5s
      timeout: 3s
      retries: 10

  article-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  comment-cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  article-service-1:
    build:
      context: ./src/ArticleService
    environment:
      ConnectionStrings__Articles: Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh
      Redis__Connection: article-cache:6379
      INSTANCE_ID: article-1
    depends_on:
      article-db:
        condition: service_healthy
      article-cache:
        condition: service_started

  article-service-2:
    build:
      context: ./src/ArticleService
    environment:
      ConnectionStrings__Articles: Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh
      Redis__Connection: article-cache:6379
      INSTANCE_ID: article-2
    depends_on:
      article-db:
        condition: service_healthy
      article-cache:
        condition: service_started

  article-service-3:
    build:
      context: ./src/ArticleService
    environment:
      ConnectionStrings__Articles: Host=article-db;Port=5432;Database=articles;Username=hh;Password=hh
      Redis__Connection: article-cache:6379
      INSTANCE_ID: article-3
    depends_on:
      article-db:
        condition: service_healthy
      article-cache:
        condition: service_started

  article-nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3

  comment-service:
    build:
      context: ./src/CommentService
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Comments: Host=comment-db;Port=5432;Database=comments;Username=hh;Password=hh
      Redis__Connection: comment-cache:6379
    depends_on:
      comment-db:
        condition: service_healthy
      comment-cache:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3
      - comment-service

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  article-db-data:
  comment-db-data:
  grafana-data:
